[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pipeline"
version = "0.1.0"
description = "Pydantic -> dbt ETL pipeline for e-commerce retail data"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "gdown>=5.0",
    "dbt-postgres>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]
