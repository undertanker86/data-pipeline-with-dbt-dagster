[project]
name = "data_pipeline_dagster"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.24",
    "dagster-dbt",
    "dbt-postgres>=1.7",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "data-pipeline",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[tool.uv.sources]
data-pipeline = { path = "./packages/data_pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "data_pipeline_dagster"
registry_modules = [
    "data_pipeline_dagster.components.*",
]


